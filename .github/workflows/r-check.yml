name: R checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install smoke-test dependency
        run: Rscript -e 'install.packages("readxl")'
      - name: Run privacy check
        run: bash scripts/privacy_check.sh
      - name: Run smoke test
        run: Rscript tests/smoke_test.R
